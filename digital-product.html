<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Delivery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/digital-product.css" />
  </head>
  <body>
    <main>
      <div class="badge">Digital transfer in progress</div>
      <section class="product-intro">
        <h1 class="product-name" id="product-name">Mystery Treat</h1>
        <p class="product-price" id="product-price">$0.00</p>
        <p class="product-description" id="product-description">
          Scan a code from the vending machine to start your download.
        </p>
      </section>

      <section id="animation-container" aria-live="polite"></section>

      <p class="animation-caption" id="animation-caption">
        A flurry of particles transports your selection straight to your
        device. Keep this tab open while we finish the transfer.
      </p>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js" integrity="sha512-gS0YJIUKGwEuITdSb9VjA36TObgATJEfkE7E5Wdl66iRS0LlwM651c01qmPvvrLpzjAU6YewsG32IOzBSSMS4w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="scripts/items-data.js"></script>
    <script src="scripts/digital-product.js"></script>
  </body>
</html>
